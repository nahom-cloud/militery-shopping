<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewport" content="width-device-width, inital-scale=1.0">
        <title>Login form in HTML and css | codehal</form></title>
        <link rel="stylesheet" href="style.css">
       <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
        <link href='https://cdn.boxicons.com/3.0.6/fonts/brands/boxicons-brands.min.css' rel='stylesheet'>
</head>

<body>
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="username" required>
                <i class='bxds  bx-user'></i> 
            </div>
             <div class="input-box">
                <input type="password" placeholder="password" required>
                <i class='bxds  bx-lock-keyhole'></i> 
                   </div>
            <div class="remember-forget">
                <label><input type="checkbox"> remember me</label>
                <a href="#">Forget password</a>
            </div>
            <button type="submit" class="btn">Login</button> 
            <div class="register-link">
                <p>dont have an account? <a href="#">Regester</a></p>
            </div>
        </form>
    </div>
</body>
</html>
