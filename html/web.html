<!DOCTYPE html>
<html>

<title>signin for militery shop</title>
 <link rel="shortcut icon" type="x-icon" href="logo.jpg">

<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="stylesheet" href="styles2.css">

<body>

<div class="form-container">
  <form id="loginForm">
    <h1>Login</h1>
    <label for="loginEmail">Email:</label>
     <i class="bx bx-envelope"></i>
    <input type="email" id="loginEmail" name="loginEmail" required><br>
    <label for="loginPassword">Password:</label>
     <i class="bx bx-lock"></i>
    <input type="password" id="loginPassword" name="loginPassword" required><br>
    <button type="submit"><a href="shoping (2).html">Login</a></button>
    <a href="#" onclick="showRegister()">Register here</a>
    <a href="email.html">forget password</a>
  </form>
<form id="registerForm" style="display: none;">
    <h4>Register</h4>
  <label for="regName">Firstname:</label>
    <i class="bx bx-user"></i>
    <input type="text" id="regName" name="regName" required><br>
        <label for="regName">middlename:</label>
    <i class="bx bx-user"></i>
    <input type="text" id="regName" name="regName" required><br>
  <label for="regName">lastname:</label>
    <i class="bx bx-user"></i>
    <input type="text" id="regName" name="regName" required><br>
  <label for="regEmail">Email:</label>
    <i class="bx bx-envelope"></i>
    <input type="email" id="regEmail" name="regEmail" required><br>
  <label for="regPassword">Password:</label>
    <i class="bx bx-lock"></i>
    <input type="password" id="regPassword" name="regPassword" required><br>
  <label for="regConfirmPassword">Confirm Password:</label>
    <i class="bx bx-lock"></i>
    <input type="password" id="regConfirmPassword" name="regConfirmPassword" required><br>
  <button type="submit" class="toggle-button">Sign Up</button>
  
   <a href="#" onclick="showLogin()">Login here</a>
  </form>
  </div>
   
</form>
</div>

<script>
function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
}
function showresetpassword() {
  document.getElementById('forgetpasswordForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
}
function showpassword() {
  document.getElementById('passwordForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
}
function showLogin() {
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}
</script>

</body>
